[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meteoalertapi2"
version = "0.4.0"
description = "Weather alerts for European regions from MeteoAlarm.org. A maintained fork of meteoalertapi."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Rolf Berkenbosch" }]
maintainers = [{ name = "mastermc0" }]
dependencies = ["requests", "xmltodict"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = ["pytest", "requests-mock"]

[project.urls]
Source = "https://github.com/mastermc0/meteoalertapi2"
Issues = "https://github.com/mastermc0/meteoalertapi2/issues"
Original = "https://github.com/rolfberkenbosch/meteoalert-api"

[tool.hatch.build.targets.sdist]
include = ["meteoalertapi2", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.ruff]
line-length = 100
